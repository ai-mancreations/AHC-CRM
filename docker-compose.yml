version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: american_hair_club
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET: dev-only-change-me
      FERNET_KEY: 06tb92nniOgLsGScFj2GCEi6mBFwpHMgV1B_WUUQoiE=
    depends_on:
      - mongo
      - redis
    volumes:
      - ./backend:/app

  celery-worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.jobs.celery_app worker --beat --loglevel=info
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: american_hair_club
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_SECRET: dev-only-change-me
      FERNET_KEY: 06tb92nniOgLsGScFj2GCEi6mBFwpHMgV1B_WUUQoiE=
    depends_on:
      - mongo
      - redis
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  mongo_data:
